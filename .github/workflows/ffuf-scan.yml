on:
  push:
    branches: [ "main" ]
jobs:
  fuzzing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Install ffuf
      run: |
        go install github.com/ffuf/ffuf/v2@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH